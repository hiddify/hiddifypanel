name: Upload Python Package

on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - '*' # Push events to matching v*, i.e. v1.0, v20.15.10

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          # by default, it uses a depth of 1
          # this fetches all history so that we can read each commit
          fetch-depth: 0
      - name: Generate Changelog
        run: |
          .github/release_message.sh > release_message.md
          echo "ref_name=${{ github.ref_name }} ${{ github.ref-name }} ${{ contains('dev', github.ref_name) }} ${{ contains(github.ref_name,'dev') }}"
      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          prerelease: ${{ contains(github.ref_name,'b') }}
          body_path: release_message.md

  deploy:
    needs: release
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: hiddifypanel/admin_v2/package-lock.json
    - name: Build Admin V2 UI
      working-directory: hiddifypanel/admin_v2
      run: npm ci && npm run build
    - name: Set up uv
      uses: astral-sh/setup-uv@v5
    - name: Build and publish
      env:
        UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        sed -i "/^is_released_version/c is_released_version=True" hiddifypanel/VERSION.py
        # uv publish uploads everything in dist/, so never build on top of stale artifacts
        rm -rf dist
        # uv build builds the sdist first and the wheel from that sdist, so an
        # incomplete sdist fails here instead of shipping a broken release.
        uv build
        # The npm build above leaves a 271MB node_modules inside the package directory.
        # If it ever reaches the wheel again, the upload fails with a bare 400.
        if unzip -l dist/*.whl | grep -q node_modules; then
          echo "::error::wheel contains node_modules — check MANIFEST.in and [tool.setuptools.packages.find]"
          exit 1
        fi
        # admin_v2/ is excluded as build-time source; what ships is vite's output in
        # static/admin-v2/. That directory is committed, so a failed npm build would
        # otherwise publish stale assets instead of failing.
        if ! unzip -l dist/*.whl | grep -q 'hiddifypanel/static/admin-v2/index.html'; then
          echo "::error::wheel has no built admin UI — did the 'Build Admin V2 UI' step run?"
          exit 1
        fi
        ls -lh dist/
        uvx twine check --strict dist/*
        # --check-url lets a re-run skip files already on PyPI rather than failing on them
        uv publish --check-url https://pypi.org/simple/hiddifypanel/
