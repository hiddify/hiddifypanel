[project.urls]
homepage = "https://hiddify.com"
repository = "https://github.com/hiddify/hiddify-manager/"
documentation = "https://hiddify.com/manager"

[project]
name = "hiddifypanel"
version = '12.3.3'
description = "hiddifypanel multi proxy panel"
readme = "README.md"
authors = [{ name = "hiddify" }]
license = { file = "LICENSE.md" }
keywords = ["proxy", "panel", "multi"]
requires-python = ">=3.13"



dependencies = [
    "apiflask[async]>=3.1.1",
    "babel==2.18.0",
    "bleach>=6.4.0",
    "bootstrap-flask==2.5.0",
    "celery>=5.6.3,<6.0.0",
    "flask-admin==1.6.1",
    "flask-adminlte3==1.0.9",
    "flask-classful==0.16.0",
    "flask-login==0.6.3",
    "flask-restful==0.3.10",
    "flask-sqlalchemy==3.1.1",
    "flask-session==0.8.0",
    "flask-wtf>=1.3.0",
    "flask>=3.1.3",
    "markupsafe==3.0.3",
    "pymysql>=1.2.0",
    "pyyaml==6.0.3",
    "sqlalchemy[asyncio]==2.0.46",
    "strenum==0.4.15",
    "wtforms==3.1.2",
    "werkzeug>=3.1.8",
    "ansi2html==1.9.2",
    "bjoern==3.2.2",
    "click>=8.4.2",
    "cloudflare>=5.4.0",
    "pydantic>=2.13.4",
    "cryptography>=49.0.0",
    "fastenumplus==1.4.0",
    "flask-babel==4.0.0",
    "loguru==0.7.3",
    "maxminddb>=3.1.1",
    "ping3==5.1.5",
    "psutil>=7.2.2",
    "python-dateutil==2.9.0.post0",
    "python-dotenv>=1.2.2",
    "python-redis-cache==4.0.2",
    "python-slugify==8.0.4",
    "redis>=8.0.1",
    "requests>=2.34.2",
    "pytelegrambotapi>=4.34.0",
    "user-agents==2.2.0",
    "xtlsapi==3.3.0",
    "mysqlclient==2.2.8",
    "sonora>=0.2.3,<1.0.0",
    "protobuf>=5.26.1",
    "asgiref>=3.11.1,<4.0.0",
    "dynaconf>=3.3.2,<4.0.0",
    "json5>=0.15.0,<1.0.0",
    "jinja2>=3.1.6",
    "marshmallow>=4.3.0",
    "setuptools>=83.0.0",
    "dnspython>=2.8.0",
    "granian>=2.7.9",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15.21",
    "ty>=0.0.58",
    "gitchangelog==3.0.4",
    "mkdocs==1.6.1",
    "flask-debugtoolbar==0.16.0",
    "grpcio-tools"
]

[tool.ruff]
line-length = 240
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty]
line-length = 240

[project.scripts]
hiddifypanel = "hiddifypanel.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hiddifypanel"]
exclude = ["tests", ".github"]

[tool.setuptools.package-data]
"hiddifypanel" = [
    "translations/*/LC_MESSAGES/*.mo",
    "translations.i18n/*.json"
]
#"" = ["hiddifypanel/translations/*/LC_MESSAGES/*.mo"]


[uv]
index-url = "https://pypi.org/simple"


