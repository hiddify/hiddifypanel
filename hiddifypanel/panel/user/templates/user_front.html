<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Installed app (PWA): iOS zooms the page into any focused field under 16px. maximum-scale=1 stops that
      // auto-zoom (iOS still allows pinch zoom); in a browser tab the viewport stays as it is.
      if (window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true) {
        document.querySelector('meta[name=viewport]').content += ', maximum-scale=1'
      }
    </script>
    <meta name="apple-itunes-app" content="app-id=6596777532, app-argument=hiddify://import/{{ profile_url }}">
    <meta name="google-play-app" content="app-id=app.hiddify.com">
    <!-- The user page's own icon in the browser tab. The 256 px one is also the picture the install guide shows. -->
    <link rel="icon" type="image/png" sizes="32x32" href="{{ hutils.flask.app_icon_url('favicon-user-32.png') }}">
    <link rel="icon" type="image/png" sizes="256x256" href="{{ hutils.flask.app_icon_url('favicon-user-256.png') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ hutils.flask.app_icon_url('app-icon-user-apple-180.png') }}">
    <link rel="manifest" href="{{ url_for('common_bp.LoginView:create_pwa_manifest', secret_uuid=g.account.uuid or '', icon=hutils.flask.icon_color('user')) }}">
    <!-- App Color: what the install guide needs to offer this page's app icon in other colors -->
    <script>window.__APP_ICON__ = {{ hutils.flask.app_icon_info('user', g.proxy_path) | tojson }};</script>
    <title>Hiddify | Panel</title>
    <script>
      window.appVersion = {{ version | tojson }};
      window.deepLink = {{ ("hiddify://import/%s"|format(profile_url)) | tojson }};
      window.__USER_FRONT_STATIC__ = {{ static_prefix | tojson }};
    </script>
    {% if static_css %}
    <link rel="stylesheet" crossorigin href="{{ static_css }}">
    {% endif %}
  </head>
  <body>
    <div id="root"></div>
    <script type="module" crossorigin src="{{ static_js }}"></script>
  </body>
</html>
