<!doctype html>
<html lang="{{ locale }}" dir="{{ 'rtl' if locale in ('fa', 'ar') else 'ltr' }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Installed app (PWA): iOS zooms the page into any focused field under 16px. maximum-scale=1 stops that
      // auto-zoom (iOS still allows pinch zoom); viewport-fit=cover lets the page draw
      // under the status bar (the top bar grows by it). In a browser tab the viewport stays as it is.
      if (window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true) {
        document.querySelector('meta[name=viewport]').content += ', maximum-scale=1, viewport-fit=cover'
      }
    </script>
    <title>HiddifyManager</title>
    <script>
      window.__API_BASE__ = {{ api_base | tojson }};
      window.__ROUTER_BASE__ = {{ router_base | tojson }};
      window.__LOCALE__ = {{ locale | tojson }};
      window.__PROXY_PATH__ = {{ proxy_path | tojson }};
      window.__PANEL_VERSION__ = {{ panel_version | tojson }};
      window.__PANEL_LOGO_URL__ = {{ panel_logo_url | tojson }};
      window.__MONACO_BASE__ = {{ monaco_base | tojson }};
      window.__ADMIN_MENU__ = {{ admin_menu | tojson }};
      window.__ADMIN_NOTICES__ = {{ admin_notices | tojson }};
      window.__PANEL_MODE__ = {{ panel_mode | tojson }};
      window.__NODE_INFO__ = {{ node_info | tojson }};
      window.__ACCOUNT_MODE__ = {{ account_mode | tojson }};
      window.__CAPABILITIES__ = {{ capabilities | tojson }};
      window.__NEEDS_QUICK_SETUP__ = {{ needs_quick_setup | tojson }};
      window.__TELEGRAM__ = {{ telegram | tojson }};
      window.__PASSKEY_SUGGESTION__ = {{ passkey_suggestion | tojson }};
    </script>
    <link rel="stylesheet" crossorigin href="{{ static_css }}">
    <link rel="icon" type="image/x-icon" href="{{ static_url_for(filename='images/favicon.ico') }}">
    <!-- Installed app (PWA): Hiddify's icon. Without these the browser asks /apple-touch-icon.png and /favicon.ico at the
         site root, which the decoy site answers (so the app got the decoy site's icon). -->
    <link rel="apple-touch-icon" sizes="180x180" href="{{ static_url_for(filename='images/app-icon-apple-180.png') }}">
    <link rel="manifest" href="{{ hurl_for('common_bp.LoginView:create_pwa_manifest', secret_uuid=g.account.uuid or '') }}">
    <meta name="theme-color" content="#1a1b21">
    <!-- Installed app on iOS: the page draws under the status bar, so the topbar's color runs up behind the clock
         (the topbar adds env(safe-area-inset-top) to its height). Without it iOS paints its own plain strip there. -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  </head>
  <body>
    <div id="app"></div>
    <script type="module" crossorigin src="{{ static_js }}"></script>
  </body>
</html>
